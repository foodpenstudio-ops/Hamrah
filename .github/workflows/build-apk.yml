
name: Build Hamrah APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          if [ -f Hamrah_GitHub_Starter.zip ]; then
            unzip -q Hamrah_GitHub_Starter.zip -d starter
          fi
          WRAPPER=$(find . -name gradlew -type f -print -quit)
          if [ -n "$WRAPPER" ]; then
            DIR=$(dirname "$WRAPPER")
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            DIR=$(find . -name settings.gradle.kts -printf '%h\n' -quit)
            cd "${DIR:-.}"
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamrah-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
